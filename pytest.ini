[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --strict-config

markers =
    integration: butuh PostgreSQL sungguhan (set TEST_DATABASE_URL)
    slow: berjalan lama, dilewati di run cepat

filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore::PendingDeprecationWarning:starlette.*
